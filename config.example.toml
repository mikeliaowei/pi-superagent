# pi-superagent configuration. Copy to ~/.config/pi-superagent/config.toml and edit.
# Secrets never go in this file: only the names of the environment variables that hold them.

[github]
# The repository the agent works in, as owner/name. For several repositories, remove `repo` here and `checkout`
# below and add one [[repos]] table per repository (see the end of this file).
repo = "your-org/your-repo"
# The bot account the agent comments and opens pull requests as. People mention it as @<agent_login>.
agent_login = "your-bot"
# Environment variable holding the bot's fine-grained token (contents, issues, pull requests: read and write).
token_env = "SUPERAGENT_GITHUB_TOKEN"

[policy]
# GitHub logins allowed to ask for work by mentioning the bot. Anyone else's comments on a live
# Ticket's thread are passed to the worker as context only, never as new requests.
allowed = ["your-login"]
# Who requests made on this machine (`superagent ask`, `answer`, the panel, the Pi skill) are recorded as.
# Anyone who can run `superagent` here is the operator. Default: your OS user name.
# local_user = "your-name"

[executor]
# Local clone of the repository (with an `origin` remote). Worktrees are created from it.
checkout = "~/src/your-repo"
# Where per-Ticket worktrees live. Default: <state_dir>/work
# work_dir = "~/.local/share/pi-superagent/work"
# Branch pull requests target, and the worktrees start from (origin/<base_branch>).
base_branch = "main"
# What runs each worker: "pi" (the Pi coding agent) or "copilot" (GitHub Copilot CLI, signed in with
# `copilot login`). Copilot uses `model` (as Copilot names it, for example "claude-sonnet-5.5") and `thinking`,
# not `provider` or `tools`.
agent = "pi"
# The Pi binary. On Windows, if this path does not exist, the `pi` on PATH (e.g. npm's pi.cmd) is used; to pin one,
# use forward slashes or single quotes: pi = 'C:\Users\me\AppData\Roaming\npm\pi.cmd'
pi = "~/.pi/agent/bin/pi"
# The Copilot CLI, by path or on PATH (agent = "copilot").
# copilot = "copilot"
# Model for workers. Always explicit: the user's Pi defaults are never used.
provider = "anthropic"
model = "claude-sonnet-5-5"
# Pi thinking level.
thinking = "medium"
# Tools Pi may use (comma-separated allow-list).
tools = "read,grep,find,ls,edit,write,bash"
# When a repo has a test_command and it fails, the worker gets this many fix attempts before the Ticket is
# reported blocked.
max_test_retries = 2
# At most this many workers run at once (1-16). Further launches wait in the queue.
max_workers = 2
# Extra environment variables removed from the workers' environment, on top of token_env.
secret_env = ["GITHUB_TOKEN", "GH_TOKEN"]

[service]
# Seconds between GitHub polls (60-3600).
poll_seconds = 60
# SQLite database, Pi sessions and (by default) worktrees live here.
state_dir = "~/.local/share/pi-superagent"
# Localhost port workers report to with `superagent-report`.
report_port = 8741

# Several repositories: one table per repository, instead of [github] repo and [executor] checkout.
# Every name must be covered by the one token in token_env.
# [[repos]]
# name = "your-org/your-repo"
# checkout = "~/src/your-repo"
# base_branch = "main"            # default: [executor] base_branch
# test_command = "make test"      # run with `sh -c` (cmd.exe on Windows) in the worktree before any pull request;
#                                 # default: none
# test_timeout = 900              # seconds
#
# [[repos]]
# name = "your-org/other-repo"
# checkout = "~/src/other-repo"
