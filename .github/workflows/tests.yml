name: tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
        include:
          # Native Windows (S16): cmd.exe test commands, taskkill, Git for Windows hardening.
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[panel]"
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . 2>&1 | tee test-output.txt
      - name: Report failures as annotations
        if: failure()
        shell: bash
        # Job logs need a signed-in viewer; annotations are public, so failures are readable by anyone.
        run: python .github/report_failures.py test-output.txt
